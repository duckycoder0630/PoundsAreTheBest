<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pounds Weight Converter</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .converter-box { max-width: 300px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        label, input, select, button { display: block; width: 100%; margin-bottom: 15px; padding: 8px; box-sizing: border-box; }
        #result { font-weight: bold; font-size: 1.2em; color: #333; }
    </style>
</head>
<body>

<div class="converter-box">
    <h2>Weight Converter</h2>
    
    <label for="poundsInput">Pounds (lbs):</label>
    <input type="number" id="poundsInput" placeholder="Enter weight in lbs" value="1">

    <label for="unitSelect">Convert to:</label>
    <select id="unitSelect">
        <option value="kilograms">Kilograms (kg)</option>
        <option value="ounces">Ounces (oz)</option>
        <option value="grams">Grams (g)</option>
        <option value="stones">Stones (st)</option>
    </select>

    <button onclick="convertWeight()">Convert</button>

    <div id="result">Result: </div>
</div>

<script>
// JSON object storing the conversion factors (1 pound equals...)
const conversionRates = {
    "kilograms": 0.45359237,
    "ounces": 16,
    "grams": 453.59237,
    "stones": 0.07142857
};

function convertWeight() {
    // Get values from the UI
    const pounds = parseFloat(document.getElementById('poundsInput').value);
    const targetUnit = document.getElementById('unitSelect').value;
    
    // Validate input
    if (isNaN(pounds)) {
        document.getElementById('result').innerText = "Please enter a valid number.";
        return;
    }

    // Fetch the multiplier from the JSON object
    const factor = conversionRates[targetUnit];
    
    // Calculate and display result
    const calculatedValue = (pounds * factor).toFixed(4);
    document.getElementById('result').innerText = `Result: ${calculatedValue} ${targetUnit}`;
}
</script>

</body>
</html>
