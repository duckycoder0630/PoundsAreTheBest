<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pounds Weight Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .results-title {
            margin-top: 25px;
            font-size: 14px;
            text-transform: uppercase;
            color: #777;
            letter-spacing: 1px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f1f1f1;
            font-size: 18px;
        }
        .unit-name {
            color: #666;
        }
        .unit-value {
            font-weight: bold;
            color: #222;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Pounds (lbs) Converter</h2>
    
    <div class="input-group">
        <label for="poundsInput">Enter Weight in Pounds (lbs):</label>
        <input type="number" id="poundsInput" value="1" placeholder="0" min="0" step="any">
    </div>

    <div class="results-title">All Conversions(you can ctrl f cuz there a lot)</div>
    <div id="resultsContainer"></div>
</div>

<script>
    const conversionRatesJSON = {
        "Yottagrams (Yg)": 453.59237/1000000000000000000000000,
        "Zettagrams (Zg)": 453.59237/1000000000000000000000,
        "Exagrams (Eg)": 453.59237/1000000000000000000,
        "Petagrams (Pg)": 453.59237/1000000000000000,
        "Teragrams (Tg)": 453.59237/1000000000000,
        "Gigagrams (Gg)": 453.59237/1000000000,
        "Megagrams (Mg)": 453.59237/1000000,

        "Hectograms (hg)": 4.5359237,
        "Dekagrams (dag)": 45.359237,
        "Grams (g)": 453.59237,
        "Decigrams (dg)": 4535.9237,
        "Centigrams (cg)": 45359.237,
        "Milligrams (mg)": 453592.37,
        "Micrograms (μg)": 453.59237*1000000,
        "Nanograms (ng)": 453.59237*1000000000,
        "Picograms (pg)": 453.59237*1000000000000,
        "Femtograms (fg)": 453.59237*1000000000000000,
        "Attograms (ag)": 453.59237*1000000000000000000,
        "Zeptograms (zg)": 453.59237*1000000000000000000000,
        "Yoctograms (yg)": 453.59237*1000000000000000000000000,
        "US Tons (short ton)": 0.0005,
        "UK Tons (long ton)": 0.00044643,
        "Metric Tons (t)": 0.00045359,
        "Ounces (oz)": 16,
        "Stones (st)": 0.07142857,
        "Grains (gr)": 7000,
        "Pennyweights (dwt)": 7000/24,
        "Troy Ounces (t oz)": 7000/480,
        "Troy Pounds (t lb)": 1.2152797,
        "Carats (ct)": 2267.96185,
        "Debens (dbn)": 4.98,
        "Qedets (qdt)": 49.845,
        "Shematy (shȝts)": 59.814378,
        "Firkins (firkin)": 0.017857142857142856,
        "Atomic Mass Units (u)": 2.731595236E+26,
        "Earth's Mass": 7.590233768E-26,
        "Sun's Mass": 2.267961849E-31,
        "Deuteron Mass": 1.356604465E+26,
        "Nuetron Mass": 2.708129588E+26,
        "Proton Mass": 2.711862403E+26,
        "Muon Mass": 2.408200133E+27,
        "2011 Hyundai Elantra Sedan (GLS, Limited)": 1/2701,
        "2011 Hyundai Elantra Touring (Hatchback/Wagon)": 1/2969,
        "Talents (biblical hebrew)": 0.0132629348,
        "Minas (biblical hebrew)": 0.7957760877,
        "Shekels (biblical hebrew)": 39.788804386,
        "Pims (biblical hebrew)": 26.5258695907,
        "Bekans (biblical hebrew)": 79.577608772,
        "Gerahs (biblical hebrew)": 795.77608772,
        "Talents (biblical greek)": 0.0222349201,
        "Minas (biblical greek)": 1.3340952059,
        "Tetradrachmas (biblical greek)": 33.352380147,
        "Dididrachmas (biblical greek)": 66.704760294,
        "Drachmas (biblical greek)": 133.40952059,
        "Libras (aincent roman": 1.3791,
        "Uncias (aincent roman)": 1.3791/12,
        "Sescuncias (aincent roman)": 1.3791/8,
        "Sextans (aincent roman)": 1.3791/6,
        "Quadrans (aincent roman)": 1.3791/4,
        "Triens (aincent roman)": 1.3791/3,
        "Quincunxes (aincent roman)": 1.3791*(5/12),
        "Semissis (aincent roman)": 1.3791*(1/2),
        "Septunxes (aincent roman)": 1.3791*(7/12),
        "Bessis (aincent roman)": 1.3791*(2/3),
        "Dodrans (aincent roman)": 1.3791*(3/4),
        "Dextans (aincent roman)": 1.3791*(5/6),
        "Deunxes (aincent roman)": 1.3791*(11/12),
        "Planck Mass": 20838438.285,
        "Electron Mass(rest)": 4.979393625E+29,
        "Daltons": 2.731612015E+26,
        "Graves (G)": 0.4536,
        "Cloves": 0.125,
        "Criths": 50435.634,
        "Hundredweights (long)": 0.0089,
        "Hundredweights (short)": 0.01,
        "Kilotonne (kt)": 4.5359237e-7,
        "Kips": 0.001,
        "Marks": 1.8229,
        "Metric Pounds": 0.9072,
        "Mites": 140000,
        "Mites (metric)": 9071.8474,
        "Newtons (N)": 4.4482,
        "Ounces (u.s. Food Nutrition Labeling)": 16.1997,
        "Pudi": 0.0277,
        "Quarters": 0.0357,
        "Quarters (long)": 0.0018,
        "Quarters (short)": 0.002,
        "Sheets": 700,
        "Bags of Coffee": 0.0076,
        "Bags of Portland Cement": 0.0106
    };

    const poundsInput = document.getElementById('poundsInput');
    const resultsContainer = document.getElementById('resultsContainer');

    function convertWeight() {
        const pounds = parseFloat(poundsInput.value);
        
        if (isNaN(pounds)) {
            resultsContainer.innerHTML = '<div style="color:#999; padding: 10px 0;">Enter a valid number to see conversions.</div>';
            return;
        }

        let htmlContent = '';

        for (const [unit, factor] of Object.entries(conversionRatesJSON)) {
            const convertedValue = pounds * factor;
            
            const formattedValue = parseFloat(convertedValue.toFixed(31));

            htmlContent += `
                <div class="result-item">
                    <span class="unit-name">${unit}</span>
                    <span class="unit-value">${formattedValue}</span>
                </div>
            `;
        }

        resultsContainer.innerHTML = htmlContent;
    }

    poundsInput.addEventListener('input', convertWeight);

    convertWeight();
</script>

</body>
</html>
